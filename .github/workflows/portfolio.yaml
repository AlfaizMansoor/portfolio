name: Portfolio

on:
  workflow_dispatch:
  push:
    branches: 
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs: 
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: checkout code
        uses: actions/checkout@v7

      - name: github pages
        uses: actions/configure-pages@v6

      - name: upload artifacts
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./templates/

      - name: deploy pages
        uses: actions/deploy-pages@v4